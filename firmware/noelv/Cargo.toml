[package]
name = "noelv"
version = "0.1.0"
edition = "2024"

[dependencies]
riscv-rt = { version = "0.18" }
riscv = "0.16"
portable-atomic = { version = "1" }
derive-mmio = "0.8"
static_assertions = "1"
embedded-io = "0.7"
embedded-hal = "1"
log = "0.4"
critical-section = "1"

once_cell = { version = "1", default-features = false, features = ["critical-section"], optional = true }
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
grlib = { path = "../grlib" }

[features]
# Activate the embassy-time driver using the core mtimer.
time-driver-mtimer = ["dep:once_cell", "dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

